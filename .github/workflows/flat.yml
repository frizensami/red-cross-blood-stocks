name: Flat Data

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: blood-stocks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scheduled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch blood stocks
        id: fetch
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            if npm run fetch; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 60)); fi
          done
          echo "Fetch failed after 3 attempts; success marker was not published."
          exit 1
      - name: Commit validated data and success marker
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "flat-data"
          git config user.email "flat-data@users.noreply.github.com"
          git add blood-stocks.json scrape-status.json
          git commit -m "Flat: validated scrape $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
